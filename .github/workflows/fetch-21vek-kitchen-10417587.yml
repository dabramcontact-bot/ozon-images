name: Build 10417587 kitchen images

on:
  push:
    paths:
      - .github/workflows/fetch-21vek-kitchen-10417587.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact 889-232 72-piece photos and make 3x4
        shell: bash
        run: |
          set -e
          out='products/10417587'
          rm -rf "$out"
          mkdir -p "$out/original" "$out/3x4"
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/149 Safari/537.36'
          url='https://prom.ua/m-7298480682529741775-kuhnya-vodoj-parom.html'
          curl -L --max-time 45 --connect-timeout 10 --compressed -A "$ua" -sS "$url" -o "$out/page.html"
          python3 - <<'PY'
          import re,html,pathlib,json
          s=pathlib.Path('products/10417587/page.html').read_text('utf-8',errors='ignore')
          pats=[
            r'https?:\\?/\\?/images\.prom\.ua/[^"\'<> ]+?\.(?:jpg|jpeg|png|webp)',
            r'https?://images\.prom\.ua/[^"\'<> ]+?\.(?:jpg|jpeg|png|webp)',
          ]
          urls=[]
          for pat in pats:
              for u in re.findall(pat,s,re.I):
                  u=html.unescape(u).replace('\\/','/').split('?')[0]
                  if u not in urls: urls.append(u)
          good=[]
          for u in urls:
              low=u.lower()
              if any(x in low for x in ['logo','icon','avatar','payment','delivery']): continue
              good.append(u)
          page='https://prom.ua/m-7298480682529741775-kuhnya-vodoj-parom.html'
          pathlib.Path('products/10417587/images_source.txt').write_text('\n'.join(good[:30])+'\n','utf-8')
          pathlib.Path('products/10417587/source.json').write_text(json.dumps({'page':page,'model':'889-232','set':'72 items','urls':good[:30]},ensure_ascii=False,indent=2),'utf-8')
          print('\n'.join(good[:20]))
          PY
          i=0
          while IFS= read -r img; do
            [ -n "$img" ] || continue
            i=$((i+1))
            curl -L --max-time 30 --connect-timeout 10 -sS -A "$ua" "$img" -o "$out/original/$i.img" || true
            [ "$i" -ge 20 ] && break
          done < "$out/images_source.txt"
          command -v ffmpeg >/dev/null
          n=0
          for f in "$out"/original/*.img; do
            [ -s "$f" ] || continue
            if ffprobe -v error -show_entries stream=width,height -of csv=p=0 "$f" >/dev/null 2>&1; then
              n=$((n+1))
              ffmpeg -loglevel error -y -i "$f" -vf "scale=900:1200:force_original_aspect_ratio=decrease,pad=900:1200:(ow-iw)/2:(oh-ih)/2:color=white" -frames:v 1 -q:v 2 "$out/3x4/${n}.jpg"
              [ "$n" -ge 8 ] && break
            fi
          done
          [ "$n" -ge 1 ] || { echo 'No usable exact-model images'; exit 3; }
          idx=1
          while [ "$n" -lt 8 ]; do
            src="$out/original/$idx.img"
            [ -s "$src" ] || { idx=1; src="$out/original/1.img"; }
            case $((n%5)) in
              0) crop='crop=iw*0.80:ih*0.80:iw*0.10:ih*0.10' ;;
              1) crop='crop=iw*0.72:ih:0:0' ;;
              2) crop='crop=iw*0.72:ih:iw*0.28:0' ;;
              3) crop='crop=iw:ih*0.72:0:0' ;;
              *) crop='crop=iw:ih*0.72:0:ih*0.28' ;;
            esac
            n=$((n+1))
            ffmpeg -loglevel error -y -i "$src" -vf "$crop,scale=900:1200:force_original_aspect_ratio=decrease,pad=900:1200:(ow-iw)/2:(oh-ih)/2:color=white" -frames:v 1 -q:v 2 "$out/3x4/${n}.jpg"
            idx=$((idx+1))
          done
      - name: Commit images
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add products/10417587
          git commit -m 'Add exact 889-232 72-piece Ozon 3x4 images' || exit 0
          git push
