name: Fetch Intex PureSpa photos 20260812

on:
  push:
    paths:
      - .github/workflows/fetch-intex-purespa-20260812.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python3 -m pip install -q requests pillow
      - name: Build exact 3x4 product photos
        shell: bash
        run: |
          python3 - <<'PY'
          import io
          from pathlib import Path
          import requests
          from PIL import Image

          products = {
            '5846888': [
              'https://intexpartner.com/media/productimg/1802/28442EX_1_preview.webp',
              'https://intexpartner.com/media/productimg/1802/Senza-titolo-1_preview.webp',
              'https://intexpartner.com/media/productimg/1802/28442EX_2_preview.webp',
              'https://intexpartner.com/media/productimg/1802/28442EX_3_preview.webp',
              'https://intexpartner.com/media/productimg/1802/28442EX_5_preview.webp',
              'https://intexpartner.com/media/productpack/1802/Acc-SPA-Greywood_0012_Oggetto-vettoriale-avanzato.webp',
              'https://intexpartner.com/media/productimg/2023/29001_1.webp',
              'https://intexpartner.com/media/productimg/2025/28503_1.webp',
            ],
            '10500500': [
              'https://intexpartner.com/media/productimg/2026/28494_static_preview.webp',
              'https://intexpartner.com/media/productimg/2026/28494_static_2_preview.webp',
              'https://intexpartner.com/media/productimg/2026/28494np_static_preview.webp',
              'https://intexpartner.com/media/productimg/2026/28494_inuse_2_preview.webp',
              'https://intexpartner.com/media/productimg/2026/28494_static_6_preview.webp',
              'https://intexpartner.com/media/productimg/2026/28494_inuse_4_preview.webp',
              'https://intexpartner.com/media/productimg/2026/28494_static_3_preview.webp',
              'https://intexpartner.com/media/productimg/2026/28494_detail_preview.webp',
            ],
          }

          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0', 'Accept-Language': 'ru-RU,ru;q=0.9,en;q=0.8'})

          def pad34(im):
            if im.mode in ('RGBA', 'LA') or (im.mode == 'P' and 'transparency' in im.info):
              rgba = im.convert('RGBA')
              bg = Image.new('RGBA', rgba.size, 'white')
              bg.alpha_composite(rgba)
              im = bg.convert('RGB')
            else:
              im = im.convert('RGB')
            im.thumbnail((840, 1140), Image.Resampling.LANCZOS)
            canvas = Image.new('RGB', (900, 1200), 'white')
            canvas.paste(im, ((900-im.width)//2, (1200-im.height)//2))
            return canvas

          for sku, urls in products.items():
            out = Path(sku)
            out.mkdir(exist_ok=True)
            for old in out.glob(f'{sku}_*.jpg'):
              old.unlink()
            for idx, url in enumerate(urls, 1):
              r = session.get(url, timeout=40)
              r.raise_for_status()
              im = Image.open(io.BytesIO(r.content))
              im.load()
              ready = pad34(im)
              ready.save(out / f'{sku}_{idx}.jpg', 'JPEG', quality=92, optimize=True)
              print(sku, idx, url, im.size)
          PY
      - name: Commit photos
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 5846888 10500500
          git commit -m 'Add Intex PureSpa Ozon 3x4 photos 20260812' || exit 0
          git push
