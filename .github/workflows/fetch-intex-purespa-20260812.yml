name: Fetch Intex PureSpa photos 20260812

on:
  push:
    paths:
      - .github/workflows/fetch-intex-purespa-20260812.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python3 -m pip install -q requests pillow
      - name: Fetch exact Glow Deluxe images, convert to 3x4 and upload
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, io, os
          import requests
          from PIL import Image

          sku = '10500500'
          urls = [
            'https://media.intex.fr/13463-cart_default/28494np-spa-gonflable-galaxie-4-places.jpg',
            'https://media.intex.fr/13464-cart_default/28494np-spa-gonflable-galaxie-4-places.jpg',
            'https://media.intex.fr/13465-cart_default/28494np-spa-gonflable-galaxie-4-places.jpg',
            'https://media.intex.fr/13466-cart_default/28494np-spa-gonflable-galaxie-4-places.jpg',
            'https://media.intex.fr/13467-cart_default/28494np-spa-gonflable-galaxie-4-places.jpg',
            'https://media.intex.fr/13468-cart_default/28494np-spa-gonflable-galaxie-4-places.jpg',
            'https://media.intex.fr/13469-cart_default/28494np-spa-gonflable-galaxie-4-places.jpg',
            'https://media.intex.fr/13470-cart_default/28494np-spa-gonflable-galaxie-4-places.jpg',
          ]

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = os.environ.get('BRANCH', 'main')
          api = f'https://api.github.com/repos/{repo}/contents'
          gh = requests.Session()
          gh.headers.update({
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ozon-intex-photo-builder',
          })
          src = requests.Session()
          src.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
              'Referer': 'https://www.intex.fr/',
          })

          def pad34(im):
              if im.mode in ('RGBA', 'LA') or (im.mode == 'P' and 'transparency' in im.info):
                  rgba = im.convert('RGBA')
                  bg = Image.new('RGBA', rgba.size, 'white')
                  bg.alpha_composite(rgba)
                  im = bg.convert('RGB')
              else:
                  im = im.convert('RGB')
              im.thumbnail((840, 1140), Image.Resampling.LANCZOS)
              canvas = Image.new('RGB', (900, 1200), 'white')
              canvas.paste(im, ((900-im.width)//2, (1200-im.height)//2))
              return canvas

          for idx, url in enumerate(urls, 1):
              r = src.get(url, timeout=40)
              r.raise_for_status()
              im = Image.open(io.BytesIO(r.content)); im.load()
              ready = pad34(im)
              buf = io.BytesIO()
              ready.save(buf, 'JPEG', quality=90, optimize=True)
              path = f'{sku}/{sku}_{idx}.jpg'
              existing = gh.get(f'{api}/{path}', params={'ref': branch}, timeout=30)
              payload = {
                  'message': f'Add {sku} image {idx} 3x4',
                  'content': base64.b64encode(buf.getvalue()).decode('ascii'),
                  'branch': branch,
              }
              if existing.status_code == 200:
                  payload['sha'] = existing.json()['sha']
              elif existing.status_code != 404:
                  existing.raise_for_status()
              put = gh.put(f'{api}/{path}', json=payload, timeout=60)
              put.raise_for_status()
              print('uploaded', path, 'source', im.size, 'output', ready.size)
          PY
