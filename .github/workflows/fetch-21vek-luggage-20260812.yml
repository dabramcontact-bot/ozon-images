name: Build full luggage photo map 20260813

on:
  push:
    paths:
      - .github/workflows/fetch-21vek-luggage-20260812.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build all exact large gallery links
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,os,requests,re
          repo=os.environ['REPOSITORY']; branch=os.environ.get('BRANCH') or 'main'; token=os.environ['GH_TOKEN']
          s=requests.Session(); s.headers.update({'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'luggage-map'})
          src='luggage-20260812/current_21vek_links.json'; api=f'https://api.github.com/repos/{repo}/contents/{src}'
          j=s.get(api,params={'ref':branch},timeout=30).json(); report=json.loads(base64.b64decode(j['content']).decode())
          lines=[]
          for sku,data in report.items():
            if not data.get('ok'): raise RuntimeError(f'{sku} not verified')
            imgs=[]
            for u in data.get('images',[]):
              if '/imgproxy/large/plain/img/galleries/' not in u: continue
              if f'/{sku}_' not in u: continue
              if u not in imgs: imgs.append(u)
            if not imgs: raise RuntimeError(f'{sku} has no exact large images')
            lines.append('\t'.join([sku]+imgs))
          content='\n'.join(lines)+'\n'
          out='luggage-20260812/current_21vek_all.tsv'; outapi=f'https://api.github.com/repos/{repo}/contents/{out}'
          old=s.get(outapi,params={'ref':branch},timeout=30)
          payload={'message':'Create full verified luggage photo map','content':base64.b64encode(content.encode()).decode(),'branch':branch}
          if old.status_code==200: payload['sha']=old.json()['sha']
          elif old.status_code!=404: old.raise_for_status()
          r=s.put(outapi,json=payload,timeout=60); r.raise_for_status()
          print('rows',len(lines)); print('counts',[(ln.split('\t')[0],len(ln.split('\t'))-1) for ln in lines])
          PY
